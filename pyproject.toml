[project]
name = "pythonproject1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pip>=26.2.1",
    "requests>=2.34.2",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.ruff.format]
quote-style = "single"
